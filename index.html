<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo TV 2</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .cobrir #video { object-fit: cover; }
  #mensagem {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 5vh 8vw; text-align: center; white-space: pre-line;
    color: #ddd; background: #000;
    font: 500 3vw/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #debug {
    position: fixed; left: 1vw; bottom: 1vh; max-width: 70vw; margin: 0; padding: .6em .9em;
    color: #9f9; background: rgba(0, 0, 0, .75); pointer-events: none;
    font: 1.1vw/1.4 Consolas, "Courier New", monospace; white-space: pre-wrap;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" muted autoplay playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
<div id="mensagem">Carregando…</div>
<pre id="debug" hidden></pre>
<noscript><div id="mensagem">Este navegador está com JavaScript desligado.</div></noscript>
<script src="app.js"></script>
</body>
</html>
